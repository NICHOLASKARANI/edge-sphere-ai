apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: edgesphere
type: Opaque
data:
  postgres-password: <base64-encoded-password>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: edgesphere
data:
  POSTGRES_DB: edgesphere
  POSTGRES_USER: admin
  POSTGRES_INITDB_ARGS: "--data-checksums"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: edgesphere
spec:
  serviceName: postgres
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: edgesphere
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None